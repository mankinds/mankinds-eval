site_name: mankinds-eval
site_description: Open source Python library for AI evaluation
repo_url: https://github.com/mankinds-io/mankinds-eval
repo_name: mankinds-io/mankinds-eval

theme:
  name: material
  palette:
    primary: indigo
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.tabs
    - search.highlight

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - User Guide:
    - Samples and Data: guide/data.md
    - Methods:
      - Heuristic Methods: guide/methods/heuristic.md
      - ML Methods: guide/methods/ml.md
      - LLM-as-Judge: guide/methods/llm.md
      - Composite Methods: guide/methods/composite.md
    - Scorers: guide/scorers.md
    - Config Files: guide/config.md
    - CLI: guide/cli.md
    - Generators: guide/generators.md
  - API Reference:
    - Overview: api.md
    - Core:
      - Scorer: api/scorer.md
      - Sample: api/sample.md
      - Result: api/result.md
    - Methods:
      - Base: api/methods/base.md
      - Heuristic: api/methods/heuristic.md
      - ML: api/methods/ml.md
      - LLM: api/methods/llm.md
    - Utilities:
      - Callbacks: api/callbacks.md
      - Cache: api/cache.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
